{% extends 'base.html' %}
{% block titulo_pagina %}Estoque{% endblock %}
{% block titulo_cabecalho %}{{ titulo }}{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto bg-white rounded-[2.5rem] shadow-sm border border-slate-100 p-10">
    <div class="flex items-center gap-4 mb-10 border-b pb-6">
        <div class="w-12 h-12 bg-purple-100 text-purple-600 rounded-2xl flex items-center justify-center">
            <i class="fa fa-sitemap text-xl"></i>
        </div>
        <div>
            <h3 class="font-black text-slate-800 uppercase text-base tracking-tighter">{{ titulo }}</h3>
            <p class="text-sm text-slate-400 font-medium">Preencha o nome do grupo para salvar</p>
        </div>
    </div>

    <form method="post" class="tw-form space-y-6">
        {% csrf_token %}

        <div>
            <label for="id_nome">Nome do Grupo</label>
            <input type="text" id="id_nome" name="nome" value="{{ grupo.nome|default:'' }}" required>
        </div>

        <div class="flex gap-4 pt-8 border-t border-slate-50">
            <a href="{% url 'inventory:lista_grupos' %}" class="flex-1 text-center py-4 bg-slate-100 text-slate-500 font-bold rounded-2xl hover:bg-slate-200 transition">
                CANCELAR
            </a>
            <button type="submit" class="flex-1 py-4 bg-blue-600 text-white font-black rounded-2xl shadow-xl shadow-blue-500/20 hover:bg-blue-700 transition">
                SALVAR DADOS
            </button>
        </div>
    </form>
</div>
{% endblock %}
